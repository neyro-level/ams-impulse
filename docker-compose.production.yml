services:
  web:
    image: ${AMS_SEO_MONITOR_IMAGE:?Set AMS_SEO_MONITOR_IMAGE}
    command: ["web"]
    restart: always
    network_mode: host
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file:
      - path: /etc/ams-platform/ams-seo-monitor-web.env
        required: false
      - path: /opt/ams-platform/ams-seo-monitor/shared/release.env
        required: false
    environment:
      APP_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: 3000
      NODE_ENV: production
      DATABASE_RUNTIME: web
      PGOPTIONS: -c TimeZone=UTC -c statement_timeout=60000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=15000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - /var/lib/ams-platform/ams-seo-monitor/proofs:/run/ams-platform-proofs:ro
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64m
          mode: 01777
      - type: tmpfs
        target: /app/.next/cache
        tmpfs:
          size: 256m
          mode: 0750

  worker:
    image: ${AMS_SEO_MONITOR_IMAGE:?Set AMS_SEO_MONITOR_IMAGE}
    command: ["outbox-worker"]
    restart: always
    stop_grace_period: 2m
    network_mode: host
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 32m
          mode: 01777
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file:
      - path: /etc/ams-platform/ams-seo-monitor-worker.env
        required: false
      - path: /opt/ams-platform/ams-seo-monitor/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
      OUTBOX_WORKER_ID: seo-monitor-outbox
      DATABASE_RUNTIME: worker
      PGOPTIONS: -c TimeZone=UTC -c statement_timeout=60000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=15000
    healthcheck:
      test: ["CMD", "node", "dist-collector/src/worker/healthcheck.js", "outbox-worker", "seo-monitor-outbox"]
      interval: 60s
      timeout: 10s
      retries: 3

  research-worker:
    image: ${AMS_SEO_MONITOR_IMAGE:?Set AMS_SEO_MONITOR_IMAGE}
    command: ["research-worker"]
    restart: always
    stop_grace_period: 2m
    network_mode: host
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64m
          mode: 01777
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    env_file:
      - path: /etc/ams-platform/ams-seo-monitor-worker.env
        required: false
      - path: /opt/ams-platform/ams-seo-monitor/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
      RESEARCH_WORKER_ID: seo-monitor-research
      DATABASE_RUNTIME: worker
      PGOPTIONS: -c TimeZone=UTC -c statement_timeout=60000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=15000
    healthcheck:
      test: ["CMD", "node", "dist-collector/src/worker/healthcheck.js", "research-worker", "seo-monitor-research"]
      interval: 60s
      timeout: 10s
      retries: 3

  migrate:
    image: ${AMS_SEO_MONITOR_MIGRATOR_IMAGE:?Set AMS_SEO_MONITOR_MIGRATOR_IMAGE}
    command: ["migrate"]
    restart: "no"
    network_mode: host
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 64m
          mode: 01777
    mem_limit: 1g
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    profiles: ["manual"]
    env_file:
      - path: /etc/ams-platform/ams-seo-monitor-migrator.env
        required: false
      - path: /opt/ams-platform/ams-seo-monitor/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_RUNTIME: migrator
      PGOPTIONS: -c TimeZone=UTC -c statement_timeout=900000 -c lock_timeout=10000 -c idle_in_transaction_session_timeout=60000 -c application_name=ams-impulse-migrator
    healthcheck:
      disable: true

  maintenance:
    image: ${AMS_SEO_MONITOR_IMAGE:?Set AMS_SEO_MONITOR_IMAGE}
    command: ["outbox-retention"]
    restart: "no"
    network_mode: host
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    volumes:
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 32m
          mode: 01777
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    profiles: ["manual"]
    env_file:
      - path: /etc/ams-platform/ams-seo-monitor-worker.env
        required: false
      - path: /opt/ams-platform/ams-seo-monitor/shared/release.env
        required: false
    environment:
      APP_ENV: production
      NODE_ENV: production
      DATABASE_RUNTIME: worker
      PGOPTIONS: -c TimeZone=UTC -c statement_timeout=60000 -c lock_timeout=5000 -c idle_in_transaction_session_timeout=15000
    healthcheck:
      disable: true
