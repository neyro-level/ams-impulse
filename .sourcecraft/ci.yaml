on:
  schedule:
    - workflows: [daily]
      cron: "0 1 * * *"
      description: "Nightly full verification of canonical main"

workflows:
  standard-check:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed standard PR head SHA"
      unit_test_files:
        type: string
        required: true
        description: "Comma-separated relevant unit test files"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 30m
    tasks:
      - name: exact-head-standard
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          UNIT_TEST_FILES: ${{ inputs.unit_test_files }}
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - pnpm install --frozen-lockfile
              - node scripts/ci/verify-exact-head.mjs
              - pnpm verify:quick
              - node scripts/ci/run-scoped-proof.mjs unit

  risky-check:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed risky PR head SHA"
      unit_test_files:
        type: string
        required: true
        description: "Comma-separated relevant unit test files"
      integration_test_files:
        type: string
        required: true
        description: "Comma-separated relevant integration test files"
      run_security_scan:
        type: string
        required: true
        description: "Run Semgrep when the reviewed risk requires it: true or false"
      run_build:
        type: string
        required: true
        description: "Run production build when the reviewed risk requires it: true or false"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 70m
    tasks:
      - name: exact-head-risky
        env:
          APP_ENV: test
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          UNIT_TEST_FILES: ${{ inputs.unit_test_files }}
          INTEGRATION_TEST_FILES: ${{ inputs.integration_test_files }}
          RUN_SECURITY_SCAN: ${{ inputs.run_security_scan }}
          RUN_BUILD: ${{ inputs.run_build }}
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: seo_monitor_test
          TEST_DATABASE_PASSWORD: seo_monitor_test
          TEST_DATABASE_NAME: seo_monitor_ci_test
          TEST_DATABASE_SSLMODE: disable
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_USER: seo_monitor_test
          DATABASE_PASSWORD: seo_monitor_test
          DATABASE_NAME: seo_monitor_ci_test
          DATABASE_SSLMODE: disable
          DATABASE_URL: postgresql://seo_monitor_test:seo_monitor_test@127.0.0.1:5432/seo_monitor_ci_test?sslmode=disable
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-1234567890
          BETTER_AUTH_URL: http://127.0.0.1:3100
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - bash scripts/ci/prepare-heavy-environment.sh
              - node scripts/ci/verify-exact-head.mjs
              - pnpm verify:quick
              - node scripts/ci/run-scoped-proof.mjs unit
              - node scripts/ci/run-scoped-proof.mjs integration
              - bash scripts/ci/prepare-optional-risk-environment.sh
              - node scripts/ci/run-scoped-proof.mjs optional-risk

  daily:
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 120m
    tasks:
      - name: nightly-main
        env:
          APP_ENV: test
          EXPECTED_COMMIT_SHA: ""
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: seo_monitor_test
          TEST_DATABASE_PASSWORD: seo_monitor_test
          TEST_DATABASE_NAME: seo_monitor_ci_test
          TEST_DATABASE_SSLMODE: disable
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_USER: seo_monitor_test
          DATABASE_PASSWORD: seo_monitor_test
          DATABASE_NAME: seo_monitor_ci_test
          DATABASE_SSLMODE: disable
          DATABASE_URL: postgresql://seo_monitor_test:seo_monitor_test@127.0.0.1:5432/seo_monitor_ci_test?sslmode=disable
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-1234567890
          BETTER_AUTH_URL: http://127.0.0.1:3100
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - node scripts/verify-release-runtime.mjs
              - pnpm install --frozen-lockfile
              - bash scripts/ci/prepare-daily-environment.sh
              - pnpm verify:daily

  release-check:
    inputs:
      expected_commit_sha:
        type: string
        required: true
        description: "Reviewed canonical main SHA for release"
    checkout:
      fetch_depth: 0
    settings:
      max_cube_duration: 120m
    tasks:
      - name: exact-head-release
        env:
          APP_ENV: test
          EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit_sha }}
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: "5432"
          TEST_DATABASE_USER: seo_monitor_test
          TEST_DATABASE_PASSWORD: seo_monitor_test
          TEST_DATABASE_NAME: seo_monitor_ci_test
          TEST_DATABASE_SSLMODE: disable
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DATABASE_USER: seo_monitor_test
          DATABASE_PASSWORD: seo_monitor_test
          DATABASE_NAME: seo_monitor_ci_test
          DATABASE_SSLMODE: disable
          DATABASE_URL: postgresql://seo_monitor_test:seo_monitor_test@127.0.0.1:5432/seo_monitor_ci_test?sslmode=disable
          BETTER_AUTH_SECRET: ci-only-secret-not-for-production-1234567890
          BETTER_AUTH_URL: http://127.0.0.1:3100
        cubes:
          - name: verify
            image: docker.io/library/node:24.20.0-bookworm
            script:
              - corepack enable
              - corepack prepare pnpm@11.5.1 --activate
              - pnpm install --frozen-lockfile
              - bash scripts/ci/prepare-daily-environment.sh
              - node scripts/ci/verify-exact-head.mjs
              - pnpm verify:release
